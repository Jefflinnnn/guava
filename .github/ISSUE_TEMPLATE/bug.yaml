name: Bug
description: Something isn't working
labels: [bug]
projects: [jameshuangcoding/3]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Errors, logs, screenshots, sandbox or production.
