name: Feature
description: Something new to build
labels: [feature]
projects: [jameshuangcoding/3]
body:
  - type: textarea
    id: what
    attributes:
      label: What
      description: What should exist that doesn't today?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What problem does it solve?
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Acceptance criteria, one per line.
      placeholder: "- [ ] ..."
