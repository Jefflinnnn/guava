---
name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # commitlint reads the pull request's commits.
  pull-requests: read

# A new push to a branch cancels its older, still-running lint runs.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      # Runs postinstall too, which generates the Prisma clients typecheck needs.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Run ESLint
        run: pnpm lint --max-warnings 0

      - name: Typecheck
        run: pnpm typecheck

  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history, so commitlint can read every commit in the pull request.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint commit messages
        uses: wagoid/commitlint-github-action@v6
